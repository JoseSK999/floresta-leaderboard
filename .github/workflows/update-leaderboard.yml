name: Update leaderboard

on:
  workflow_dispatch:
  schedule:
    # 03:37 UTC avoids the high-load top-of-hour window.
    - cron: "37 3 * * *"

# Prevent overlapping manual/scheduled runs.
concurrency:
  group: update-leaderboard
  cancel-in-progress: false

# Needed so the workflow can commit generated files back to this repo.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate leaderboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove generated contributor reports first so stale files disappear.
          rm -rf contributors

          # Generate README source, JSON data, and contributor reports.
          python3 scripts/oss_leaderboard.py \
            --repo getfloresta/Floresta \
            --output-dir .

          # Make the generated leaderboard the repository homepage.
          cp floresta-leaderboard.md README.md
          rm floresta-leaderboard.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md floresta-leaderboard.json contributors/

          # Skip the commit if the staged generated files did not change.
          if git diff --cached --quiet; then
            echo "No leaderboard changes."
            exit 0
          fi

          today="$(date -u +'%Y-%m-%d')"

          git commit -m "Update Floresta leaderboard - ${today}"
          git push
